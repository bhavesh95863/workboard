
name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: master-workboard-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Find tests
        run: |
          echo "Finding tests"
          if grep -rn "def test" workboard/ > /dev/null 2>&1; then
            echo "Found test methods"
          else
            echo "No test methods found - this is OK for now"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          check-latest: true
          cache: 'yarn'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt-get update
          sudo apt-get install mariadb-client-10.6

      - name: Setup
        run: |
          echo "Installing frappe-bench..."
          pip install frappe-bench
          echo "Initializing bench..."
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          echo "Setting up MariaDB..."
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
          echo "✅ Setup completed successfully"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          echo "Getting workboard app..."
          bench get-app workboard $GITHUB_WORKSPACE
          echo "Setting up requirements..."
          bench setup requirements --dev
          echo "Creating new site..."
          bench new-site --db-root-password root --admin-password admin test_site
          echo "Installing workboard app..."
          bench --site test_site install-app workboard
          echo "Building assets..."
          bench build
          echo "✅ Installation completed successfully"
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          if grep -rn "def test" $GITHUB_WORKSPACE/workboard/ > /dev/null 2>&1; then
            echo "Running tests..."
            bench --site test_site run-tests --app workboard
          else
            echo "No test methods found, skipping test execution"
            echo "✅ CI setup verified successfully"
          fi
        env:
          TYPE: server
